crons:
  - name: day2-reminder
    description: "Hourly check that emails readers who haven't finished Assessment 1 within 48 hours of signup"
    cron: "0 * * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/day2-reminder"
    method: POST
    enabled: true
  - name: journey-nudge
    description: "Hourly check that nudges readers who stopped partway and have been inactive 7 days"
    cron: "30 * * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/journey-nudge"
    method: POST
    enabled: true
